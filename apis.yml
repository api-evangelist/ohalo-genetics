aid: ohalo-genetics
name: Ohalo Genetics
description: >-
  Ohalo Genetics is an American agricultural biotechnology company founded in 2019 and led by CEO
  David Friedberg, developing plant-breeding platforms and proprietary crop varieties. Its flagship
  Boosted Breeding technology — marketed as "2x + 2x = 4x" — alters the reproductive circuitry of
  parent plants so each parent passes its entire genome to the next generation rather than a random
  half, producing polyploid offspring that carry the full genetic contribution of both parents and,
  in early field trials, substantially higher yields. Ohalo pairs this with an Agile Breeding service
  and a True Seed program that ships uniform, disease-free seedlings directly to growers, with active
  programs in potato, almond (the FruitionOne self-fertile Nonpareil variety), strawberry and corn,
  delivered through partnerships such as the Allied Potato partnership and a strawberry consortium.
  The company sells plant genetics and breeding services to agricultural partners; it is not a
  software vendor and publishes no public developer program, API, SDK or machine-readable contract.
